name: Bug report
description: Report something that is broken or behaves unexpectedly.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider
      description: Which provider is affected, if any?
      placeholder: opencode, claude, anthropic...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: App version, image tag or commit hash.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
    validations:
      required: false
