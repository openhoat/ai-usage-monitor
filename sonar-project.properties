sonar.projectKey=ai-usage-monitor
sonar.projectName=Ai Usage Monitor

sonar.sources=src

# Unit tests (vitest) are co-located under src.
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Exclude test files from copy/paste (duplication) detection.
sonar.cpd.exclusions=src/**/*.test.ts,src/**/*.test.tsx

# The React UI is exercised by Playwright e2e; it has no unit coverage.
sonar.coverage.exclusions=src/web/**

sonar.sourceEncoding=UTF-8
sonar.typescript.lcov.reportPaths=dist/coverage/lcov.info

# All generated artifacts live under dist/ so a single entry in .gitignore covers them.
sonar.working.directory=dist/.scannerwork
